<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>یه دیت؟</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --plum-950:#221421;
    --plum-900:#2c1a2b;
    --plum-800:#3c2339;
    --rose-300:#e9b4c0;
    --rose-500:#d3667f;
    --gold-400:#d8ab5c;
    --cream-100:#f6ece1;
    --cream-200:#ecdfce;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:
      radial-gradient(1200px 700px at 15% 10%, rgba(216,171,92,.10), transparent 60%),
      radial-gradient(1000px 700px at 85% 90%, rgba(211,102,127,.14), transparent 60%),
      linear-gradient(160deg, var(--plum-950), var(--plum-900) 55%, var(--plum-800));
    font-family:'Vazirmatn', sans-serif;
    color:var(--cream-100);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .card{
    width:100%;
    max-width:480px;
    background:rgba(246,236,225,.04);
    border:1px solid rgba(233,180,192,.18);
    border-radius:28px;
    padding:44px 32px;
    backdrop-filter:blur(6px);
    box-shadow:0 30px 60px -20px rgba(0,0,0,.5);
    text-align:center;
    position:relative;
    overflow:hidden;
  }
  .petals{
    display:flex; justify-content:center; gap:8px; margin-bottom:22px;
  }
  .petal{
    width:10px;height:10px;border-radius:50%;
    background:rgba(246,236,225,.15);
    transition:all .4s ease;
  }
  .petal.on{background:var(--rose-500); box-shadow:0 0 12px rgba(211,102,127,.7); transform:scale(1.3);}

  .eyebrow{
    font-size:13px; letter-spacing:.14em; color:var(--gold-400);
    font-weight:600; margin-bottom:10px;
  }
  h1{
    font-size:26px; font-weight:800; margin:0 0 14px; line-height:1.5;
    color:var(--cream-100);
  }
  p.sub{ color:var(--cream-200); opacity:.8; font-size:14.5px; margin:0 0 28px; line-height:1.9;}

  .options{ display:flex; flex-direction:column; gap:12px; }
  .options.row{ flex-direction:row; flex-wrap:wrap; justify-content:center; }
  button.opt{
    border:1px solid rgba(233,180,192,.3);
    background:rgba(255,255,255,.03);
    color:var(--cream-100);
    padding:14px 18px;
    border-radius:16px;
    font-family:inherit;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    transition:.2s ease;
  }
  button.opt:hover{ background:rgba(211,102,127,.18); border-color:var(--rose-500); transform:translateY(-2px); }
  button.opt.primary{
    background:linear-gradient(135deg, var(--rose-500), #b84a63);
    border:none;
  }
  button.opt.ghost{ opacity:.7; }

  input[type=date]{
    width:100%;
    padding:14px 16px;
    border-radius:14px;
    border:1px solid rgba(233,180,192,.3);
    background:rgba(255,255,255,.04);
    color:var(--cream-100);
    font-family:inherit;
    font-size:15px;
    margin-bottom:16px;
  }
  input::-webkit-calendar-picker-indicator{ filter:invert(1); }

  .heart{
    font-size:42px; margin-bottom:6px;
    animation:pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse{ 0%,100%{transform:scale(1);} 50%{transform:scale(1.12);} }
</style>
</head>
<body>

<div class="card" id="app"></div>

<!-- EmailJS -->
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

<script>
/* =========================================================
   تنظیمات EmailJS — این ۳ مقدار رو از پنل EmailJS خودت بردار
   راهنما پایین توضیحات چت هست
========================================================= */
const EMAILJS_PUBLIC_KEY  = "4sBQXocECkOiVRHc3";
const EMAILJS_SERVICE_ID  = "service_rc1nf9s";
const EMAILJS_TEMPLATE_ID = "template_6sijb8t";

let emailReady = false;
try{
  emailjs.init({ publicKey: EMAILJS_PUBLIC_KEY });
  emailReady = true;
}catch(e){
  console.error('EmailJS init failed:', e);
}

/* =========================================================
   داده‌ی سوالات — می‌تونی گزینه‌ها رو عوض کنی
========================================================= */
const WHERE_OPTIONS = ["رستوران دنج", "کافه", "سینما", "پیاده‌روی و پارک", "جایی که خودت انتخاب کن"];
const FOOD_OPTIONS  = ["فست فود", "غذای ایرانی", "ایتالیایی", "فقط یه قهوه و دسر", "هرچی تو بخوای"];

let answers = { date:"", where:"", food:"" };
const app = document.getElementById('app');

function petals(step){
  let html = '<div class="petals">';
  for(let i=0;i<4;i++){ html += `<div class="petal ${i<step?'on':''}"></div>`; }
  html += '</div>';
  return html;
}

/* ---------- مرحله ۰: بریم دیت؟ ---------- */
function renderAsk(){
  app.innerHTML = `
    ${petals(0)}
    <div class="heart">💌</div>
    <div class="eyebrow">یه پیشنهاد کوچولو</div>
    <h1>بریم یه دیت؟</h1>
    <p class="sub">فقط چندتا سوال کوچیک مونده تا برنامه‌مون آماده بشه</p>
    <div class="options row">
      <button class="opt primary" onclick="renderDate()">اره بریم 🤍</button>
      <button class="opt ghost" onclick="renderNo()">فعلا نه</button>
    </div>
  `;
}

function renderNo(){
  app.innerHTML = `
    ${petals(0)}
    <div class="heart">🥲</div>
    <h1>باشه، هروقت خواستی بگو</h1>
    <p class="sub">همیشه یه در برات بازه</p>
    <div class="options">
      <button class="opt" onclick="renderAsk()">بازم فکر کن</button>
    </div>
  `;
}

/* ---------- مرحله ۱: تاریخ ---------- */
function renderDate(){
  app.innerHTML = `
    ${petals(1)}
    <div class="eyebrow">مرحله ۱ از ۳</div>
    <h1>کی برات خوبه؟</h1>
    <p class="sub">یه تاریخ انتخاب کن</p>
    <input type="date" id="dateInput">
    <div class="options">
      <button class="opt primary" onclick="submitDate()">بعدی</button>
    </div>
  `;
}
function submitDate(){
  const v = document.getElementById('dateInput').value;
  if(!v){ alert('یه تاریخ انتخاب کن'); return; }
  answers.date = v;
  renderWhere();
}

/* ---------- مرحله ۲: کجا ---------- */
function renderWhere(){
  app.innerHTML = `
    ${petals(2)}
    <div class="eyebrow">مرحله ۲ از ۳</div>
    <h1>کجا بریم؟</h1>
    <div class="options">
      ${WHERE_OPTIONS.map(o=>`<button class="opt" onclick="submitWhere('${o.replace(/'/g,"\\'")}')">${o}</button>`).join('')}
    </div>
  `;
}
function submitWhere(v){ answers.where = v; renderFood(); }

/* ---------- مرحله ۳: چی بخوریم ---------- */
function renderFood(){
  app.innerHTML = `
    ${petals(3)}
    <div class="eyebrow">مرحله ۳ از ۳</div>
    <h1>چی بخوریم؟</h1>
    <div class="options">
      ${FOOD_OPTIONS.map(o=>`<button class="opt" onclick="submitFood('${o.replace(/'/g,"\\'")}')">${o}</button>`).join('')}
    </div>
  `;
}
function submitFood(v){
  answers.food = v;
  saveAndFinish();
}

/* ---------- ارسال ایمیل + پیام پایانی ---------- */
function timeout(ms){
  return new Promise((_, reject)=> setTimeout(()=> reject(new Error('timeout')), ms));
}

function saveAndFinish(){
  app.innerHTML = `${petals(4)}<div class="heart">💫</div><h1>یه لحظه...</h1>`;

  const finish = ()=> renderThanks();

  if(!emailReady){
    // اگه ایمیل وصل نبود، به‌هرحال تجربه رو برای طرف مقابل خراب نکن
    console.warn('EmailJS not ready, skipping email send.');
    finish();
    return;
  }

  const sendPromise = emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {
    date:  answers.date,
    where: answers.where,
    food:  answers.food
  });

  // چه ایمیل بره چه نره، تجربه‌ی طرف مقابل همیشه با یه پیام قشنگ تموم میشه
  // (خطای فنی فقط تو کنسول لاگ میشه، نه رو صفحه)
  Promise.race([sendPromise, timeout(8000)])
    .then(()=> finish())
    .catch(err=>{ console.error('Email send failed or timed out:', err); finish(); });
}

function renderThanks(){
  app.innerHTML = `
    ${petals(4)}
    <div class="heart">🥰</div>
    <h1>وایییی خیلی خوشحالم کردی!</h1>
    <p class="sub">قرارمون افتاد. تا اون روز لحظه‌شماری می‌کنم ❤️</p>
  `;
}

try{
  renderAsk();
}catch(e){
  console.error('Initial render failed:', e);
  app.innerHTML = `<h1>مشکلی پیش اومد 😕</h1><p class="sub">صفحه رو رفرش کن. اگه ادامه داشت، کنسول مرورگر (F12) رو چک کن.</p>`;
}
</script>
</body>
</html>
