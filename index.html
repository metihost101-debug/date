<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>یه دیت؟</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --plum-950:#221421;
    --plum-900:#2c1a2b;
    --plum-800:#3c2339;
    --rose-300:#e9b4c0;
    --rose-500:#d3667f;
    --gold-400:#d8ab5c;
    --cream-100:#f6ece1;
    --cream-200:#ecdfce;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:
      radial-gradient(1200px 700px at 15% 10%, rgba(216,171,92,.10), transparent 60%),
      radial-gradient(1000px 700px at 85% 90%, rgba(211,102,127,.14), transparent 60%),
      linear-gradient(160deg, var(--plum-950), var(--plum-900) 55%, var(--plum-800));
    font-family:'Vazirmatn', sans-serif;
    color:var(--cream-100);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .card{
    width:100%;
    max-width:480px;
    background:rgba(246,236,225,.04);
    border:1px solid rgba(233,180,192,.18);
    border-radius:28px;
    padding:44px 32px;
    backdrop-filter:blur(6px);
    box-shadow:0 30px 60px -20px rgba(0,0,0,.5);
    text-align:center;
    position:relative;
    overflow:hidden;
  }
  .petals{
    display:flex; justify-content:center; gap:8px; margin-bottom:22px;
  }
  .petal{
    width:10px;height:10px;border-radius:50%;
    background:rgba(246,236,225,.15);
    transition:all .4s ease;
  }
  .petal.on{background:var(--rose-500); box-shadow:0 0 12px rgba(211,102,127,.7); transform:scale(1.3);}

  .eyebrow{
    font-size:13px; letter-spacing:.14em; color:var(--gold-400);
    font-weight:600; margin-bottom:10px; text-transform:none;
  }
  h1{
    font-size:26px; font-weight:800; margin:0 0 14px; line-height:1.5;
    color:var(--cream-100);
  }
  p.sub{ color:var(--cream-200); opacity:.8; font-size:14.5px; margin:0 0 28px; line-height:1.9;}

  .options{ display:flex; flex-direction:column; gap:12px; }
  .options.row{ flex-direction:row; flex-wrap:wrap; justify-content:center; }
  button.opt{
    border:1px solid rgba(233,180,192,.3);
    background:rgba(255,255,255,.03);
    color:var(--cream-100);
    padding:14px 18px;
    border-radius:16px;
    font-family:inherit;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    transition:.2s ease;
  }
  button.opt:hover{ background:rgba(211,102,127,.18); border-color:var(--rose-500); transform:translateY(-2px); }
  button.opt.primary{
    background:linear-gradient(135deg, var(--rose-500), #b84a63);
    border:none;
  }
  button.opt.ghost{ opacity:.7; }

  input[type=date], input.text-input{
    width:100%;
    padding:14px 16px;
    border-radius:14px;
    border:1px solid rgba(233,180,192,.3);
    background:rgba(255,255,255,.04);
    color:var(--cream-100);
    font-family:inherit;
    font-size:15px;
    margin-bottom:16px;
  }
  input::-webkit-calendar-picker-indicator{ filter:invert(1); }

  .heart{
    font-size:42px; margin-bottom:6px;
    animation:pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse{ 0%,100%{transform:scale(1);} 50%{transform:scale(1.12);} }

  .footer-link{
    position:fixed; bottom:14px; left:14px;
    font-size:11px; color:rgba(246,236,225,.35);
    text-decoration:none;
  }

  /* admin */
  .admin-item{
    text-align:right;
    background:rgba(255,255,255,.03);
    border:1px solid rgba(233,180,192,.15);
    border-radius:14px;
    padding:14px 16px;
    margin-bottom:12px;
    font-size:14px;
    line-height:2;
  }
  .admin-item .time{ color:var(--gold-400); font-size:12px; display:block; margin-bottom:6px;}
  .hidden{ display:none !important; }
</style>
</head>
<body>

<div class="card" id="app">
  <!-- filled by JS -->
</div>

<a href="#" class="footer-link" id="adminLink">پنل مدیریت</a>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
/* =========================================================
   ۱) تنظیمات فایربیس — این بخش رو با کانفیگ خودت جایگزین کن
   (راهنمای کامل ساخت پروژه فایربیس پایین توضیح داده شده)
========================================================= */
const firebaseConfig = {
  // Import the functions you need from the SDKs you need
import { initializeApp } from "firebase/app";
import { getAnalytics } from "firebase/analytics";
// TODO: Add SDKs for Firebase products that you want to use
// https://firebase.google.com/docs/web/setup#available-libraries

// Your web app's Firebase configuration
// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyBK5ZVetMVTvNCAvTDtNAfW5r4hO_n3xzc",
  authDomain: "date-d63e7.firebaseapp.com",
  projectId: "date-d63e7",
  storageBucket: "date-d63e7.firebasestorage.app",
  messagingSenderId: "962103781199",
  appId: "1:962103781199:web:9aa4d88e150f1c8dbb873a",
  measurementId: "G-R8SXW0YBKV"
};

// Initialize Firebase
const app = initializeApp(firebaseConfig);
const analytics = getAnalytics(app);
};

// رمز ساده برای دیدن پنل جواب‌ها (فقط جلوی دیدن تصادفی رو می‌گیره، امنیت واقعی نیست)
const ADMIN_PASSCODE = "love1234";

let db = null;
let firebaseError = null;
try{
  firebase.initializeApp(firebaseConfig);
  db = firebase.firestore();
}catch(e){
  console.error('Firebase init failed:', e);
  firebaseError = e;
}

/* =========================================================
   ۲) داده‌ی سوالات — می‌تونی گزینه‌ها رو عوض کنی
========================================================= */
const WHERE_OPTIONS = ["رستوران دنج", "کافه", "سینما", "پیاده‌روی و پارک", "جایی که خودت انتخاب کن"];
const FOOD_OPTIONS  = ["فست فود", "غذای ایرانی", "ایتالیایی", "فقط یه قهوه و دسر", "هرچی تو بخوای"];

let answers = { date:"", where:"", food:"" };

const app = document.getElementById('app');

function petals(step){
  let html = '<div class="petals">';
  for(let i=0;i<4;i++){ html += `<div class="petal ${i<step?'on':''}"></div>`; }
  html += '</div>';
  return html;
}

/* ---------- مرحله ۰: بریم دیت؟ ---------- */
function renderAsk(){
  app.innerHTML = `
    ${petals(0)}
    <div class="heart">💌</div>
    <div class="eyebrow">یه پیشنهاد کوچولو</div>
    <h1>بریم یه دیت؟</h1>
    <p class="sub">فقط چندتا سوال کوچیک مونده تا برنامه‌مون آماده بشه</p>
    <div class="options row">
      <button class="opt primary" onclick="renderDate()">اره بریم 🤍</button>
      <button class="opt ghost" onclick="renderNo()">فعلا نه</button>
    </div>
  `;
}

function renderNo(){
  app.innerHTML = `
    ${petals(0)}
    <div class="heart">🥲</div>
    <h1>باشه، هروقت خواستی بگو</h1>
    <p class="sub">همیشه یه در برات بازه</p>
    <div class="options">
      <button class="opt" onclick="renderAsk()">بازم فکر کن</button>
    </div>
  `;
}

/* ---------- مرحله ۱: تاریخ ---------- */
function renderDate(){
  app.innerHTML = `
    ${petals(1)}
    <div class="eyebrow">مرحله ۱ از ۳</div>
    <h1>کی برات خوبه؟</h1>
    <p class="sub">یه تاریخ انتخاب کن</p>
    <input type="date" id="dateInput">
    <div class="options">
      <button class="opt primary" onclick="submitDate()">بعدی</button>
    </div>
  `;
}
function submitDate(){
  const v = document.getElementById('dateInput').value;
  if(!v){ alert('یه تاریخ انتخاب کن'); return; }
  answers.date = v;
  renderWhere();
}

/* ---------- مرحله ۲: کجا ---------- */
function renderWhere(){
  app.innerHTML = `
    ${petals(2)}
    <div class="eyebrow">مرحله ۲ از ۳</div>
    <h1>کجا بریم؟</h1>
    <div class="options">
      ${WHERE_OPTIONS.map(o=>`<button class="opt" onclick="submitWhere('${o.replace(/'/g,"\\'")}')">${o}</button>`).join('')}
    </div>
  `;
}
function submitWhere(v){ answers.where = v; renderFood(); }

/* ---------- مرحله ۳: چی بخوریم ---------- */
function renderFood(){
  app.innerHTML = `
    ${petals(3)}
    <div class="eyebrow">مرحله ۳ از ۳</div>
    <h1>چی بخوریم؟</h1>
    <div class="options">
      ${FOOD_OPTIONS.map(o=>`<button class="opt" onclick="submitFood('${o.replace(/'/g,"\\'")}')">${o}</button>`).join('')}
    </div>
  `;
}
function submitFood(v){
  answers.food = v;
  saveAndFinish();
}

/* ---------- ذخیره در فایربیس + پیام پایانی ---------- */
function saveToLocalFallback(){
  try{
    const list = JSON.parse(localStorage.getItem('date_responses') || '[]');
    list.push({ ...answers, createdAt: new Date().toISOString(), source:'local' });
    localStorage.setItem('date_responses', JSON.stringify(list));
    return true;
  }catch(e){ console.error('localStorage fallback failed:', e); return false; }
}

function timeout(ms){
  return new Promise((_, reject)=> setTimeout(()=> reject(new Error('timeout')), ms));
}

function saveAndFinish(){
  app.innerHTML = `${petals(4)}<div class="heart">💫</div><h1>داره ثبت میشه...</h1>`;

  if(!db){
    // فایربیس اصلا وصل نشده - مستقیم برو سراغ ذخیره‌ی محلی
    saveToLocalFallback();
    renderThanks(true);
    return;
  }

  const savePromise = db.collection('responses').add({
    date: answers.date,
    where: answers.where,
    food: answers.food,
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  });

  Promise.race([savePromise, timeout(8000)])
    .then(()=>{ renderThanks(false); })
    .catch(err=>{
      console.error('Save failed or timed out:', err);
      const savedLocally = saveToLocalFallback();
      renderThanks(savedLocally);
    });
}

function renderThanks(localOnly){
  app.innerHTML = `
    ${petals(4)}
    <div class="heart">🥰</div>
    <h1>وایییی خیلی خوشحالم کردی!</h1>
    <p class="sub">قرارمون افتاد. تا اون روز لحظه‌شماری می‌کنم ❤️</p>
    ${localOnly ? '<p class="sub" style="opacity:.55;font-size:12px;">(روی همین گوشی ذخیره شد، اتصال به سرور برقرار نشد)</p>' : ''}
  `;
}

/* ========================= پنل مدیریت ========================= */
document.getElementById('adminLink').addEventListener('click', (e)=>{
  e.preventDefault();
  const code = prompt('رمز پنل رو وارد کن:');
  if(code !== null && code.trim() === ADMIN_PASSCODE.trim()){ renderAdmin(); }
  else if(code !== null){ alert('رمز اشتباهه'); }
});

function renderLocalEntries(){
  let list = [];
  try{ list = JSON.parse(localStorage.getItem('date_responses') || '[]'); }catch(e){}
  if(!list.length) return '';
  return list.slice().reverse().map(d=>{
    const t = d.createdAt ? new Date(d.createdAt).toLocaleString('fa-IR') : '—';
    return `<div class="admin-item">
      <span class="time">${t} (روی همین گوشی)</span>
      📅 تاریخ: ${d.date || '—'}<br>
      📍 کجا: ${d.where || '—'}<br>
      🍽️ چی: ${d.food || '—'}
    </div>`;
  }).join('');
}

function renderAdmin(){
  app.innerHTML = `
    <div class="eyebrow">پنل مدیریت</div>
    <h1>جواب‌های ثبت شده</h1>
    <div id="adminList" style="text-align:right;">در حال بارگذاری...</div>
    <div class="options" style="margin-top:18px;">
      <button class="opt" onclick="renderAsk()">بازگشت به سایت</button>
    </div>
  `;
  const localHtml = renderLocalEntries();

  if(!db){
    document.getElementById('adminList').innerHTML =
      localHtml || '<p class="sub">هنوز جوابی ثبت نشده و اتصال به فایربیس هم برقرار نیست.</p>';
    return;
  }

  db.collection('responses').orderBy('createdAt','desc').get().then(snap=>{
    const list = document.getElementById('adminList');
    let cloudHtml = '';
    if(!snap.empty){
      cloudHtml = snap.docs.map(doc=>{
        const d = doc.data();
        const t = d.createdAt ? d.createdAt.toDate().toLocaleString('fa-IR') : '—';
        return `<div class="admin-item">
          <span class="time">${t}</span>
          📅 تاریخ: ${d.date || '—'}<br>
          📍 کجا: ${d.where || '—'}<br>
          🍽️ چی: ${d.food || '—'}
        </div>`;
      }).join('');
    }
    const combined = cloudHtml + localHtml;
    list.innerHTML = combined || '<p class="sub">هنوز جوابی ثبت نشده.</p>';
  }).catch(err=>{
    console.error('Admin fetch failed:', err);
    document.getElementById('adminList').innerHTML =
      '<p class="sub">خطا در دریافت اطلاعات از فایربیس' +
      (localHtml ? '، ولی این‌ها روی گوشی ذخیره شده بودن:' : '.') + '</p>' + localHtml;
  });
}

try{
  renderAsk();
}catch(e){
  console.error('Initial render failed:', e);
  app.innerHTML = `<h1>مشکلی پیش اومد 😕</h1><p class="sub">صفحه رو رفرش کن. اگه ادامه داشت، کنسول مرورگر (F12) رو چک کن.</p>`;
}

window.addEventListener('error', (e)=>{
  if(!app.innerHTML.trim()){
    app.innerHTML = `<h1>مشکلی پیش اومد 😕</h1><p class="sub">صفحه رو رفرش کن (Ctrl+Shift+R). اگه ادامه داشت، کنسول مرورگر رو چک کن.</p>`;
  }
});
</script>
</body>
</html>
